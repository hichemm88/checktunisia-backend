openapi: 3.1.0
info:
  title: Qayed — API publique v1
  version: "1.1.0"
  summary: API partenaires + widget embarqué pour la fiche de police Qayed.
  description: |
    API publique v1 permettant à une plateforme tierce (PMS, moteur de réservation…)
    de créer une **session de fiche** pour un séjour, puis d'ouvrir le **widget Qayed**
    (formulaire réglementaire officiel, jamais dupliqué chez le partenaire) pour que
    le réceptionniste ou le voyageur saisisse les informations d'identité. Le résultat
    est notifié de façon asynchrone par **webhook signé**.

    Le modèle suit le pattern *Stripe Checkout* :

    1. Le partenaire échange un **code de liaison** (généré côté propriétaire de
       l'établissement dans Qayed) contre un lien établissement↔partenaire durable.
    2. Le partenaire crée une **session de fiche** (`POST /v1/fiche-sessions`) pour un
       séjour identifié par sa référence de réservation (`booking_ref`).
    3. Le partenaire ouvre `widget_url` dans une iframe (voir le snippet
       `widget-integration.html` et le guide `quickstart.md`).
    4. Le widget notifie sa fenêtre parente via `postMessage`, et Qayed notifie le
       partenaire via un **webhook** signé (`fiche.submitted`, `fiche.failed`,
       `session.expired`).

    ### Hôte

    L'API et le widget sont servis par **`https://api.qayed.tn`** : `/v1/*`,
    `/widget/fiche` et `/widget/v1/*`. N'utilisez jamais `https://qayed.tn` comme hôte
    d'API : il redirige (308) vers le site vitrine `www.qayed.tn`, qui ne sert aucune
    route d'API. `widget_url` pointe directement sur
    `https://api.qayed.tn/widget/fiche?token=...` (aucune redirection), et l'origine à
    vérifier dans vos écouteurs `postMessage` est exactement `https://api.qayed.tn`.

    ### Emplacement des routes

    Cette API vit délibérément **hors** du préfixe `/api/v1` utilisé par l'API interne
    de l'application (session Sanctum). `/v1/*` et `/widget/v1/*` (ainsi que
    `/widget/fiche`) forment un contrat public tiers versionné indépendamment, sur le
    même principe que les autres routes publiques de l'application.

    ### Authentification

    - **API partenaire (`/v1/*`)** : `Authorization: Bearer qyd_live_...` (production)
      ou `Authorization: Bearer qyd_test_...` (mode test — voir plus bas). Jamais de
      session Sanctum sur ce périmètre.
    - **Widget (`/widget/v1/*`)** : un **JSON Web Token** à usage unique (HS256, TTL
      15 minutes par défaut), reçu dans `widget_url` sous forme de paramètre de requête
      `?token=...`, et consommé au premier appel à `GET /widget/v1/bootstrap`. Cet appel
      renvoie un **jeton de session widget opaque** (`widget_token`), qui doit ensuite
      être envoyé en `Authorization: Bearer {widget_token}` sur tous les appels suivants
      (`guests`, `scan`, `submit`). Le JWT d'origine ne peut donc jamais être rejoué,
      même dans sa fenêtre de validité.

    ### Mode test

    Une clé `qyd_test_...` fonctionne à l'identique d'une clé `qyd_live_...`, à
    l'exception de deux effets de bord toujours désactivés en mode test : aucun envoi
    réel via le relais WhatsApp de transmission aux autorités, et aucun événement
    `fiche.submitted` envoyé aux webhooks configurés (`fiche.failed` et
    `session.expired` restent envoyés).

    Comme `fiche.submitted` n'est **pas** envoyé en mode test, validez votre
    intégration de bout en bout en relisant le statut avec
    `GET /v1/fiche-sessions/{session_id}` ou `GET /v1/fiche-sessions/by-booking-ref` :
    `status`, `fiche_id`, `guest_count` et `expected_guest_count` y sont renvoyés à
    l'identique en mode test et en mode live.

    ### Séjours et départs automatiques (1.1.0)

    Pour les fiches créées par l'API, votre logiciel est la source de vérité des
    séjours : tenez `departure_date` à jour avec `PATCH /v1/fiches/{fiche_id}`
    (prolongation, départ anticipé, changement de chambre).

    - Chaque jour à **05:30 (heure de Tunis)**, les séjours créés via l'API dont la
      date de départ prévue est atteinte sont clos à cette date, avec exactement les
      effets d'un départ saisi dans Qayed (journal d'audit, notification au manager ;
      rien n'est envoyé à l'autorité, aucun quota n'est décompté). Les séjours saisis
      dans Qayed ne sont pas concernés.
    - L'occupation d'une chambre est dérivée des séjours ouverts : une chambre reste
      occupée tant qu'un autre séjour y est ouvert.
    - Une nouvelle fiche le jour J sur une chambre dont le séjour précédent se termine
      le jour J ou avant n'est jamais refusée ni retardée. Plus généralement, un
      `room_id` visant une chambre où un séjour est encore ouvert n'est jamais refusé :
      ce séjour est d'abord clos (à sa date de départ prévue si elle est passée,
      sinon à la date du jour).

    ### Parcours du widget (1.1.0)

    Le widget s'ouvre directement sur l'écran de scan du premier voyageur, avec un
    bandeau pré-rempli (dates, chambre, noms), un seul bouton principal par écran et un
    compteur « 2 sur 3 ». La validation partielle est permise (« Valider avec 2
    voyageurs sur 3 ») ; les voyageurs manquants se complètent plus tard en recréant une
    session pour le même `booking_ref` (mode `amend`, toujours la même fiche unique).
    L'iframe doit porter `allow="camera"`.

    ### Messages postMessage du widget

    Le widget envoie à sa fenêtre parente trois messages (schémas
    `WidgetMessageSubmitted`, `WidgetMessageClosed` et `WidgetMessageError`, résumés
    dans l'extension `x-widget-messages`). Ils sont émis avec `targetOrigin: '*'` :
    vérifiez toujours `event.origin === 'https://api.qayed.tn'` (ou l'origine de
    `widget_url`, via `new URL(widget_url).origin`) avant de les lire. Ce sont des
    signaux d'interface ; la source de vérité reste le webhook signé (live) ou
    `GET /v1/fiche-sessions/...` (test et live).

    ### Nouveautés 1.1.0

    Ajouts optionnels uniquement, aucun changement incompatible :

    - Hôte documenté corrigé : `https://api.qayed.tn` (API, `widget_url` et origine
      `postMessage`).
    - `GET /v1/operators` : utilisateurs des hébergeurs liés, pour relier vos comptes
      aux comptes Qayed.
    - `POST /v1/fiche-sessions` : champs `operator` et `locale`, réponse
      `operator_matched` ; un `room_id` dont la chambre est occupée n'est plus jamais
      refusé.
    - `GET /v1/fiche-sessions/...` : `guest_count` et `expected_guest_count`.
    - `PATCH /v1/fiches/{fiche_id}` : prolongation, départ anticipé, changement de
      chambre ; `GET /v1/fiches/{fiche_id}` renvoie aussi le séjour (`arrival_date`,
      `departure_date`, `checked_out_at`, `room_id`, `stay_status`).
    - Départs automatiques quotidiens des séjours créés via l'API.
    - Widget : ouverture directe sur le scan du premier voyageur, validation
      partielle, messages `postMessage` documentés.

    ### Limite de débit

    Toutes les routes `/v1/*` sont limitées à **120 requêtes/minute par clé API**
    (indexé sur l'identifiant de la clé, pas sur l'adresse IP). Chaque réponse porte
    les en-têtes `X-RateLimit-Limit`, `X-RateLimit-Remaining` et `X-RateLimit-Reset`
    (timestamp Unix de réinitialisation). `POST /v1/establishment-links` a une limite
    plus stricte et dédiée : **5 requêtes/minute** (IP + clé API), anti brute-force du
    code de liaison. `GET /widget/v1/bootstrap` (et les routes authentifiées par
    session widget) sont limitées à **30 requêtes/minute** par session.

    Un dépassement renvoie `429` avec le code d'erreur `rate_limited` et un en-tête
    `Retry-After` (secondes).

    ### Enveloppe d'erreur

    Toute erreur sur `/v1/*` ou `/widget/v1/*` renvoie le même format, voir
    `components.schemas.Error` : `{"error": {"code", "message", "doc_url"}}`. Le champ
    `code` est **stable** et fait partie du contrat — construisez votre logique
    applicative dessus, jamais sur le texte de `message` (en français, susceptible
    d'évoluer).
servers:
  - url: https://api.qayed.tn
    description: |
      Production (chemins déjà préfixés par /v1 ou /widget/v1). Ne pas utiliser
      https://qayed.tn, qui redirige vers le site vitrine et ne sert aucune API.
tags:
  - name: Liaison établissement
    description: Échange du code de liaison propriétaire↔partenaire.
  - name: Établissements
    description: Établissements liés à votre clé API.
  - name: Sessions de fiche
    description: Création et consultation des sessions de fiche (modèle Stripe Checkout).
  - name: Fiches
    description: Consultation d'une fiche et mise à jour de son séjour (départ, chambre).
  - name: Widget
    description: |
      Endpoints du widget embarqué, appelés par l'iframe elle-même — jamais
      directement par le backend du partenaire. Authentifiés par JWT (bootstrap) puis
      par jeton de session widget opaque (tout le reste).
security:
  - bearerAuth: []
paths:
  /v1/establishment-links:
    post:
      tags: [Liaison établissement]
      summary: Échanger un code de liaison contre un lien établissement↔partenaire
      description: |
        Le code de liaison est généré côté Qayed par le propriétaire (owner) de
        l'établissement, valable **24 heures**, à usage unique. Cet appel est limité à
        **5 requêtes/minute** (par IP et par clé API) pour dissuader le brute-force.
      operationId: exchangeEstablishmentLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_code]
              properties:
                link_code:
                  type: string
                  maxLength: 20
                  description: Code de liaison communiqué par l'établissement.
                  example: "QY-7F3K2A"
      responses:
        '201':
          description: Établissement lié avec succès.
          content:
            application/json:
              schema:
                type: object
                properties:
                  establishment_id:
                    type: string
                    format: uuid
                  establishment_name:
                    type: string
                  linked_at:
                    type: string
                    format: date-time
                required: [establishment_id, establishment_name, linked_at]
              example:
                establishment_id: "0f2e6b8a-1c3d-4e5f-9a0b-1c2d3e4f5a6b"
                establishment_name: "Dar el Kenz"
                linked_at: "2026-09-16T09:12:00+00:00"
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '422':
          description: |
            Code invalide, expiré (`link_code_expired`) ou déjà utilisé
            (`link_code_already_used`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/establishments:
    get:
      tags: [Établissements]
      summary: Lister les établissements liés à votre clé API
      operationId: listEstablishments
      responses:
        '200':
          description: Liste des établissements actifs liés au partenaire.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Establishment'
                required: [data]
              example:
                data:
                  - establishment_id: "0f2e6b8a-1c3d-4e5f-9a0b-1c2d3e4f5a6b"
                    name: "Dar el Kenz"
                    status: "active"
                    quota: { used: 42, limit: 200, period: "monthly" }
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/operators:
    get:
      tags: [Établissements]
      summary: Lister les utilisateurs Qayed des hébergeurs liés (1.1.0)
      description: |
        Utilisateurs **actifs** des hébergeurs (organisations) propriétaires de vos
        établissements liés. Sert au manager côté partenaire à relier **à la main**
        ses propres comptes (réceptionnistes) aux comptes Qayed, puis à envoyer
        `operator.user_id` dans `POST /v1/fiche-sessions` pour que la fiche soit
        attribuée au bon utilisateur. Ni e-mail ni téléphone ne sont jamais renvoyés ;
        l'utilisateur technique « Intégration API » est exclu.
      operationId: listOperators
      responses:
        '200':
          description: Utilisateurs actifs, triés par prénom puis nom.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Operator'
                required: [data]
              example:
                data:
                  - id: "7d3e2c1b-0a9f-4e8d-b7c6-5a4b3c2d1e0f"
                    name: "Sami Ben Ali"
                    role: "receptionist"
                  - id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
                    name: "Leila Haddad"
                    role: "hotel_admin"
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/establishments/{hotel_id}/rooms:
    get:
      tags: [Établissements]
      summary: Lister les chambres réelles d'un établissement
      description: |
        Renvoie les chambres telles qu'elles existent dans Qayed. Les libellés
        partenaire (import OTA, etc.) diffèrent presque toujours des noms Qayed —
        construisez votre propre table de correspondance à partir de cette liste et
        envoyez `room_id` (pas un nom en texte libre) dans `POST /v1/fiche-sessions`
        pour que la fiche soit réellement rattachée à la bonne chambre.
      operationId: listEstablishmentRooms
      parameters:
        - name: hotel_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Chambres de l'établissement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        number: { type: string }
                        floor: { type: integer, nullable: true }
                        type: { type: string }
                        capacity: { type: integer }
                        status: { type: string, enum: [available, occupied, maintenance, inactive] }
              example:
                data:
                  - id: "3c1a9e7a-2b4d-4f6a-8c0e-1a2b3c4d5e6f"
                    number: "Chambre verte"
                    floor: 1
                    type: "standard"
                    capacity: 2
                    status: "available"
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          description: Établissement non lié à ce partenaire (`establishment_not_linked`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/fiche-sessions:
    post:
      tags: [Sessions de fiche]
      summary: Créer (ou réutiliser) une session de fiche pour un séjour
      description: |
        Point d'entrée du modèle *Stripe Checkout* : cet appel prépare une fiche pour
        un séjour identifié par `(establishment_id, booking_ref)` et renvoie
        `widget_url`, l'URL à ouvrir dans une iframe pour que le formulaire Qayed soit
        rempli. **Idempotent** : un second appel avec le même `(establishment_id,
        booking_ref)` alors qu'une session est encore utilisable renvoie **200** avec
        la session existante plutôt que d'en créer une nouvelle (double-clic côté
        PMS partenaire). Si une fiche existe déjà pour ce séjour (`active` ou
        `completed`), une nouvelle session en mode `amend` est créée à la place —
        aucune fiche dupliquée n'est produite.

        Le quota de fiches (`checkins_per_month`) n'est **jamais bloquant** sur cet
        appel — un dépassement peut être facturé après coup mais ne bloque jamais la
        création. Le seul blocage commercial possible est `api_access_disabled`
        (fonctionnalité API non activée sur le plan/l'établissement).

        **Opérateur (1.1.0)** : si `operator.user_id` désigne un utilisateur actif du
        même hébergeur que l'établissement (voir `GET /v1/operators`), la fiche lui est
        attribuée exactement comme s'il l'avait saisie dans Qayed (historique, journal
        d'audit, statistiques par utilisateur) et `operator_matched` vaut `true`.
        Absent, inconnu, désactivé, d'un autre hébergeur ou mal formé : jamais
        d'erreur, la fiche est attribuée à l'utilisateur d'intégration,
        `operator.name` est conservé dans le journal d'audit de la fiche et
        `operator_matched` vaut `false`. Un utilisateur désactivé entre la création de
        la session et la soumission retombe aussi sur l'utilisateur d'intégration.
        Sur une session réutilisée, la dernière demande fait foi.

        **Chambre occupée** : un `room_id` visant une chambre où un séjour est encore
        ouvert n'est jamais refusé ; ce séjour est clos (à sa date de départ prévue si
        elle est passée, sinon à la date du jour) et la session est créée.
      operationId: createFicheSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [establishment_id, booking_ref, arrival_date, departure_date, guests]
              properties:
                establishment_id:
                  type: string
                  format: uuid
                booking_ref:
                  type: string
                  maxLength: 100
                  description: Référence de réservation du partenaire — clé d'idempotence avec establishment_id.
                arrival_date:
                  type: string
                  format: date
                departure_date:
                  type: string
                  format: date
                  description: Doit être postérieure ou égale à arrival_date.
                room:
                  type: string
                  maxLength: 100
                  nullable: true
                  description: |
                    Libellé partenaire brut, conservé pour affichage uniquement (badge
                    « via {partenaire} » dans l'historique Qayed). Ne rattache la fiche à
                    AUCUNE chambre réelle — utilisez `room_id` pour ça.
                room_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: |
                    Chambre RÉELLE de l'établissement (voir
                    `GET /v1/establishments/{hotel_id}/rooms`). Si fournie, doit
                    appartenir à `establishment_id` — sinon `422 validation_error`.
                    Une chambre où un séjour est encore ouvert n'est jamais refusée :
                    ce séjour est clos d'abord (voir la description ci-dessus). Peut
                    être ajouté sur un appel ultérieur tant que la fiche est encore un
                    brouillon jamais soumis ; après soumission, changez de chambre
                    avec `PATCH /v1/fiches/{fiche_id}`.
                guests:
                  type: array
                  maxItems: 20
                  description: |
                    Pré-remplissage optionnel (tous les champs sont facultatifs par
                    voyageur) — le tableau peut être vide, le réceptionniste complétera
                    dans le widget. Ces valeurs ne créent aucun voyageur tant que le
                    widget n'a pas été ouvert.
                  items:
                    type: object
                    properties:
                      first_name: { type: string, maxLength: 100, nullable: true }
                      last_name: { type: string, maxLength: 100, nullable: true }
                      nationality: { type: string, maxLength: 3, nullable: true, description: "Code pays (ISO 3166-1 alpha-3 recommandé)." }
                      id_document_number: { type: string, maxLength: 100, nullable: true }
                      id_document_type: { type: string, maxLength: 50, nullable: true }
                metadata:
                  type: object
                  nullable: true
                  additionalProperties: true
                  description: Renvoyé tel quel dans l'événement webhook fiche.submitted.
                operator:
                  type: object
                  nullable: true
                  description: |
                    (1.1.0, optionnel) Réceptionniste qui ouvre le widget côté
                    partenaire. `user_id` : identifiant choisi dans
                    `GET /v1/operators`. `name` : nom affiché côté partenaire, conservé
                    dans le journal d'audit si `user_id` ne correspond à aucun
                    utilisateur valide. Jamais de refus, voir `operator_matched`.
                  properties:
                    user_id: { type: string, maxLength: 64, nullable: true }
                    name: { type: string, maxLength: 150, nullable: true }
                locale:
                  type: string
                  enum: [fr, ar, en]
                  default: fr
                  nullable: true
                  description: (1.1.0, optionnel) Langue du widget.
            example:
              establishment_id: "0f2e6b8a-1c3d-4e5f-9a0b-1c2d3e4f5a6b"
              booking_ref: "DIAR-88213"
              arrival_date: "2026-09-20"
              departure_date: "2026-09-23"
              room: "204"
              room_id: "3c1a9e7a-2b4d-4f6a-8c0e-1a2b3c4d5e6f"
              guests:
                - first_name: "Amine"
                  last_name: "Trabelsi"
                  nationality: "TUN"
              metadata:
                pms_booking_id: "88213"
              operator:
                user_id: "7d3e2c1b-0a9f-4e8d-b7c6-5a4b3c2d1e0f"
                name: "Sami"
              locale: "fr"
      responses:
        '201':
          description: Nouvelle session créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FicheSessionCreated' }
        '200':
          description: Session existante réutilisée (idempotence, ou mode amend).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FicheSessionCreated' }
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          description: |
            `establishment_not_linked` (établissement non lié à ce partenaire) ou
            `api_access_disabled` (fonctionnalité API désactivée sur ce plan).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Erreur de validation (`validation_error`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/fiche-sessions/by-booking-ref:
    get:
      tags: [Sessions de fiche]
      summary: Retrouver la dernière session connue pour une réservation
      description: |
        Utile quand vous n'avez plus le `session_id` d'origine (redémarrage de votre
        intégration, page rechargée) et voulez savoir si une fiche existe déjà pour
        cette réservation avant d'afficher/activer un bouton « Fiche police ». Même
        forme de réponse que `GET /v1/fiche-sessions/{session_id}`.
      operationId: findFicheSessionByBookingRef
      parameters:
        - name: establishment_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: booking_ref
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Dernière session connue pour ce couple (establishment_id, booking_ref).
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending, submitted, expired] }
                  fiche_id: { type: string, format: uuid, nullable: true }
                  booking_ref: { type: string }
                  created_at: { type: string, format: date-time }
                  expires_at: { type: string, format: date-time }
                  guest_count:
                    type: integer
                    description: (1.1.0) Voir `GET /v1/fiche-sessions/{session_id}`.
                  expected_guest_count:
                    type: integer
                    minimum: 1
                    description: (1.1.0) Voir `GET /v1/fiche-sessions/{session_id}`.
                required: [session_id, status, fiche_id, booking_ref, created_at, expires_at]
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '404':
          description: Aucune session n'a jamais été créée pour cette réservation (`session_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/fiche-sessions/{session_id}:
    get:
      tags: [Sessions de fiche]
      summary: Consulter le statut d'une session de fiche
      operationId: getFicheSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Statut courant de la session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string, format: uuid }
                  status:
                    type: string
                    enum: [pending, submitted, expired]
                    description: |
                      `expired` est calculé à la volée (session pending dont `expires_at`
                      est dépassée) même si le balayage planifié ne l'a pas encore
                      persisté en base.
                  fiche_id:
                    type: string
                    format: uuid
                    nullable: true
                    description: Non nul uniquement si status=submitted.
                  booking_ref: { type: string }
                  created_at: { type: string, format: date-time }
                  expires_at: { type: string, format: date-time }
                  guest_count:
                    type: integer
                    description: |
                      (1.1.0) Voyageurs effectivement déclarés sur la fiche ; 0 tant
                      qu'elle est encore un brouillon. Renvoyé en mode test comme en
                      live : c'est ce champ (avec `status`) qui permet de valider une
                      intégration en mode test, où `fiche.submitted` n'est pas envoyé.
                  expected_guest_count:
                    type: integer
                    minimum: 1
                    description: |
                      (1.1.0) Nombre de voyageurs passés dans `guests` à la création
                      de la session (minimum 1). Un écart avec `guest_count` signale
                      une validation partielle, à compléter en recréant une session
                      pour le même `booking_ref`.
                required: [session_id, status, fiche_id, booking_ref, created_at, expires_at]
              example:
                session_id: "5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e"
                status: "submitted"
                fiche_id: "a1b2c3d4-e5f6-4789-90ab-cdef01234567"
                booking_ref: "DIAR-88213"
                created_at: "2026-09-16T09:00:00+00:00"
                expires_at: "2026-09-16T09:15:00+00:00"
                guest_count: 2
                expected_guest_count: 3
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '404':
          description: Session introuvable pour ce partenaire (`session_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/fiches/{fiche_id}:
    get:
      tags: [Fiches]
      summary: Consulter une fiche soumise
      operationId: getFiche
      parameters:
        - $ref: '#/components/parameters/FicheId'
      responses:
        '200':
          description: Détail de la fiche.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fiche' }
              example:
                fiche_id: "a1b2c3d4-e5f6-4789-90ab-cdef01234567"
                booking_ref: "DIAR-88213"
                establishment_id: "0f2e6b8a-1c3d-4e5f-9a0b-1c2d3e4f5a6b"
                guest_count: 2
                submitted_at: "2026-09-16T09:14:32+00:00"
                authority_status: "relayed"
                reference_number: "QY-2026-004821"
                arrival_date: "2026-09-20"
                departure_date: "2026-09-23"
                checked_out_at: null
                room_id: "3c1a9e7a-2b4d-4f6a-8c0e-1a2b3c4d5e6f"
                stay_status: "active"
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          description: Établissement révoqué depuis (`establishment_not_linked`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Fiche introuvable ou n'appartenant pas à ce partenaire (`fiche_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Fiches]
      summary: Mettre à jour le séjour d'une fiche (1.1.0)
      description: |
        Prolongation, départ anticipé et changement de chambre, sans rouvrir le
        widget. Envoyez au moins un des champs `departure_date`, `room_id`, `room`.

        - `departure_date` ne peut pas précéder la date d'arrivée.
        - Un changement de chambre (`room_id`) clôt tout séjour encore ouvert dans la
          chambre cible.
        - Prolonger jusqu'à aujourd'hui ou plus tard un séjour déjà clos
          automatiquement le rouvre. Si sa chambre a été réattribuée entre-temps,
          indiquez aussi `room_id` (sinon `422 validation_error`).
        - Chaque modification est tracée dans le journal d'audit de la fiche.

        Tenez `departure_date` à jour : les séjours créés via l'API sont clos
        automatiquement chaque jour à 05:30 (heure de Tunis) à leur date de départ
        prévue (voir « Séjours et départs automatiques » en tête de cette spec).
      operationId: updateFiche
      parameters:
        - $ref: '#/components/parameters/FicheId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                departure_date:
                  type: string
                  format: date
                  description: Nouvelle date de départ prévue (prolongation ou départ anticipé).
                room_id:
                  type: string
                  format: uuid
                  description: Chambre de l'établissement, issue de `GET /v1/establishments/{hotel_id}/rooms`.
                room:
                  type: string
                  maxLength: 100
                  nullable: true
                  description: Libellé partenaire de la chambre, pour affichage uniquement.
            example:
              departure_date: "2026-09-25"
              room_id: "3c1a9e7a-2b4d-4f6a-8c0e-1a2b3c4d5e6f"
      responses:
        '200':
          description: Fiche mise à jour — même contenu que `GET /v1/fiches/{fiche_id}`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fiche' }
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          description: Établissement révoqué depuis (`establishment_not_linked`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Fiche introuvable ou non créée par ce partenaire (`fiche_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            `validation_error` : corps vide, `departure_date` antérieure à la date
            d'arrivée, `room_id` inconnu pour cet établissement, fiche annulée, ou
            prolongation d'un séjour clos dont la chambre a été réattribuée sans
            `room_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /widget/v1/bootstrap:
    get:
      tags: [Widget]
      summary: "[Widget uniquement] Initialiser la session widget à partir du JWT"
      description: |
        Appelé par l'iframe du widget elle-même au chargement, jamais par le backend
        du partenaire. Consomme le JWT porté par `?token=` (usage unique réel : un jti
        déjà consommé ne redonne jamais accès, même dans sa fenêtre de validité) et
        renvoie un jeton de session widget opaque à utiliser en `Authorization: Bearer`
        sur tous les appels suivants. Limité à 30 requêtes/minute par session.
      operationId: widgetBootstrap
      security:
        - widgetJwt: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: JWT émis dans widget_url.
      responses:
        '200':
          description: Session widget initialisée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string, format: uuid }
                  widget_token:
                    type: string
                    description: Jeton opaque à envoyer en Authorization Bearer sur tous les appels suivants.
                  mode: { type: string, enum: [create, amend] }
                  establishment_name: { type: string }
                  booking_ref: { type: string }
                  arrival_date: { type: string, format: date }
                  departure_date: { type: string, format: date }
                  room: { type: string, nullable: true }
                  prefill_guests:
                    type: array
                    items: { type: object, additionalProperties: true }
                  existing_guests:
                    type: array
                    description: Non vide uniquement en mode amend.
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        first_name: { type: string }
                        last_name: { type: string }
                        nationality_code: { type: string }
                        is_primary: { type: boolean }
                  expected_guest_count:
                    type: integer
                    minimum: 1
                    description: (1.1.0) Nombre de voyageurs attendus (compteur « 2 sur 3 » du widget).
                  locale:
                    type: string
                    enum: [fr, ar, en]
                    description: (1.1.0) Langue du widget demandée à la création de la session.
                required: [session_id, widget_token, mode, establishment_name, booking_ref, arrival_date, departure_date, prefill_guests, existing_guests]
        '401':
          description: JWT invalide ou signature incorrecte (`invalid_signature`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Origine de l'iframe non autorisée (`frame_disallowed`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: JWT expiré ou déjà consommé (`session_expired`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session introuvable (`session_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /widget/v1/guests:
    post:
      tags: [Widget]
      summary: "[Widget uniquement] Ajouter un voyageur à la fiche en cours"
      operationId: widgetAddGuest
      security:
        - widgetSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetGuestInput' }
      responses:
        '201':
          description: Voyageur ajouté.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      first_name: { type: string }
                      last_name: { type: string }
                      nationality_code: { type: string }
                    required: [id, first_name, last_name, nationality_code]
                required: [data]
        '401':
          description: Jeton de session widget invalide ou expiré (`session_expired`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Erreur de validation (`validation_error`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /widget/v1/guests/{guestId}:
    delete:
      tags: [Widget]
      summary: "[Widget uniquement] Retirer un voyageur de la fiche en cours"
      operationId: widgetRemoveGuest
      security:
        - widgetSession: []
      parameters:
        - name: guestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Voyageur retiré.
        '401':
          description: Jeton de session widget invalide ou expiré (`session_expired`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Voyageur introuvable sur cette fiche.

  /widget/v1/scan:
    post:
      tags: [Widget]
      summary: "[Widget uniquement] Envoyer une capture CIN/passeport pour lecture"
      description: |
        Lecture par un modèle de vision (Claude), authentifiée par le jeton de session
        widget. Nécessite `allow="camera"` sur l'iframe du partenaire pour que la caméra
        embarquée fonctionne (voir `widget-integration.html`).
      operationId: widgetScan
      security:
        - widgetSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [passport_image]
              properties:
                passport_image:
                  type: string
                  format: binary
                  description: jpeg, jpg, png, heic ou pdf — 10 Mo maximum.
                document_type:
                  type: string
                  enum: [cin, passport]
                  default: cin
                  description: |
                    Type de document photographié — ajuste le cadrage attendu et, pour
                    un passeport, déclenche la relecture déterministe de la zone MRZ en
                    complément de la lecture libre du modèle.
      responses:
        '202':
          description: Scan accepté, OCR en cours de traitement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scan_id: { type: string, format: uuid }
                      status: { type: string, description: "Statut initial de l'OCR (ex. pending)." }
                    required: [scan_id, status]
                required: [data]
        '401':
          description: Jeton de session widget invalide ou expiré (`session_expired`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Fichier invalide (`validation_error`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /widget/v1/scan/{scanId}/status:
    get:
      tags: [Widget]
      summary: "[Widget uniquement] Interroger le statut d'un scan OCR"
      operationId: widgetScanStatus
      security:
        - widgetSession: []
      parameters:
        - name: scanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Statut courant. `confidence` et `extracted` ne sont présents que si l'OCR
            est terminé avec succès ; `error` n'est présent que si l'OCR a échoué.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scan_id: { type: string, format: uuid }
                      status: { type: string }
                      confidence: { type: number, nullable: true }
                      extracted: { type: object, additionalProperties: true, nullable: true }
                      error: { type: string, nullable: true }
                    required: [scan_id, status]
                required: [data]
        '401':
          description: Jeton de session widget invalide ou expiré (`session_expired`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Scan introuvable pour cette session.

  /widget/v1/submit:
    post:
      tags: [Widget]
      summary: "[Widget uniquement] Soumettre la fiche (fin du parcours)"
      description: |
        En mode `create`, au moins un voyageur doit avoir été ajouté via `POST
        /widget/v1/guests` avant cet appel. Déclenche (hors mode test) le webhook
        `fiche.submitted` et, en mode `create`, le décompte de quota ainsi que le
        relais WhatsApp de transmission, exactement comme une fiche saisie nativement.

        La validation peut être partielle (1.1.0) : « Valider avec 2 voyageurs sur 3 ».
        Les voyageurs manquants s'ajoutent plus tard en recréant une session pour le
        même `booking_ref` (mode `amend`, toujours la même fiche unique).
      operationId: widgetSubmit
      security:
        - widgetSession: []
      responses:
        '200':
          description: Fiche soumise.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string, format: uuid }
                  fiche_id: { type: string, format: uuid }
                  guest_count: { type: integer }
                required: [session_id, fiche_id, guest_count]
              example:
                session_id: "5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e"
                fiche_id: "a1b2c3d4-e5f6-4789-90ab-cdef01234567"
                guest_count: 2
        '401':
          description: Jeton de session widget invalide ou expiré (`session_expired`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Échec de soumission (ex. aucun voyageur en mode create) —
            `validation_error`. Un webhook `fiche.failed` est également enfilé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Clé API partenaire. Format : `qyd_live_...` en production, `qyd_test_...` en
        mode test. En-tête : `Authorization: Bearer qyd_live_...`.
    widgetJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT à usage unique porté par `?token=` sur `GET /widget/v1/bootstrap`
        (HS256, TTL 15 minutes par défaut, claims `session_id`, `establishment_id`,
        `partner_id`, `iat`, `exp`, `jti`). Ne contient aucune donnée voyageur.
        Documenté ici pour référence — dans les faits ce JWT est transmis en
        paramètre de requête (`?token=`), pas en en-tête Authorization, car
        `GET /widget/v1/bootstrap` est chargé directement par le navigateur dans
        l'iframe.
    widgetSession:
      type: http
      scheme: bearer
      description: |
        Jeton de session widget opaque (48 caractères aléatoires), renvoyé par
        `GET /widget/v1/bootstrap` sous `widget_token`. TTL glissant de 20 minutes par
        défaut (prolongé à chaque appel authentifié). En-tête :
        `Authorization: Bearer {widget_token}`.
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FicheId:
      name: fiche_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    InvalidApiKey:
      description: Clé API absente, invalide ou révoquée (`invalid_api_key`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Limite de débit dépassée (`rate_limited`). Voir l'en-tête Retry-After.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Secondes avant la prochaine requête autorisée.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      description: |
        Enveloppe d'erreur unique à `/v1/*` et `/widget/v1/*` — distincte du format
        `{data, errors:[]}` utilisé par le reste de l'application, sur le modèle des
        API publiques à la Stripe.
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Message par défaut en français — n'utilisez jamais ce texte pour de la logique applicative, seulement `code`.
            doc_url:
              type: string
              format: uri
              description: "Lien direct vers la section de cette documentation décrivant ce code."
          required: [code, message, doc_url]
      required: [error]
      example:
        error:
          code: "session_expired"
          message: "Cette session a expiré."
          doc_url: "https://qayed.tn/docs/api#session_expired"
    ErrorCode:
      type: string
      description: Code d'erreur stable — ne change jamais de valeur une fois publié, seul un nouveau code peut être ajouté.
      enum:
        - invalid_api_key
        - invalid_link_code
        - link_code_expired
        - link_code_already_used
        - establishment_not_linked
        - api_access_disabled
        - quota_exceeded
        - session_expired
        - session_not_found
        - fiche_not_found
        - invalid_signature
        - frame_disallowed
        - rate_limited
        - validation_error
      x-error-details:
        invalid_api_key: { http_status: 401, message: "Clé API invalide ou révoquée." }
        invalid_link_code: { http_status: 422, message: "Code de liaison invalide." }
        link_code_expired: { http_status: 422, message: "Ce code de liaison a expiré (validité 24h)." }
        link_code_already_used: { http_status: 422, message: "Ce code de liaison a déjà été utilisé." }
        establishment_not_linked: { http_status: 403, message: "Cet établissement n'est pas lié à ce partenaire." }
        api_access_disabled: { http_status: 403, message: "L'accès API n'est pas activé pour cet établissement." }
        quota_exceeded:
          http_status: 422
          message: "Quota de fiches dépassé."
          note: >-
            Réservé par contrat : le quota de fiches n'est aujourd'hui jamais
            bloquant (dépassement facturé après coup, jamais empêché). Ce code
            existe pour rester documentable si une limite commerciale distincte
            est introduite un jour ; en v1 seul api_access_disabled bloque réellement.
        session_expired: { http_status: 410, message: "Cette session a expiré." }
        session_not_found: { http_status: 404, message: "Session introuvable." }
        fiche_not_found: { http_status: 404, message: "Fiche introuvable." }
        invalid_signature: { http_status: 401, message: "Signature invalide (JWT du widget)." }
        frame_disallowed: { http_status: 403, message: "Origine non autorisée à charger ce widget." }
        rate_limited: { http_status: 429, message: "Trop de requêtes." }
        validation_error: { http_status: 422, message: "Erreur de validation." }
    Establishment:
      type: object
      properties:
        establishment_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        quota:
          type: object
          properties:
            used: { type: integer }
            limit: { type: integer, nullable: true, description: "null = illimité." }
            period: { type: string, enum: [monthly] }
          required: [used, limit, period]
      required: [establishment_id, name, status, quota]
    FicheSessionCreated:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        widget_url:
          type: string
          format: uri
          description: |
            URL à ouvrir dans une iframe (avec `allow="camera"`) :
            https://api.qayed.tn/widget/fiche?token={jwt}, servie directement, sans
            redirection. Son origine (`new URL(widget_url).origin`, soit
            https://api.qayed.tn) est celle à comparer à `event.origin` dans vos
            écouteurs `postMessage`.
        expires_at:
          type: string
          format: date-time
          description: Expiration du JWT porté par widget_url (15 minutes par défaut).
        mode:
          type: string
          enum: [create, amend]
          description: |
            create = nouvelle fiche ; amend = une fiche existe déjà pour ce séjour
            (booking_ref), le widget permettra de la compléter/corriger sans en créer
            une seconde.
        operator_matched:
          type: boolean
          description: |
            (1.1.0) `true` si `operator.user_id` désigne un utilisateur actif du même
            hébergeur : la fiche lui sera attribuée. `false` sinon (absent, inconnu,
            désactivé, autre hébergeur, mal formé) : repli sur l'utilisateur
            d'intégration, jamais d'erreur.
      required: [session_id, widget_url, expires_at, mode]
    Operator:
      type: object
      description: (1.1.0) Utilisateur Qayed d'un hébergeur lié. Jamais d'e-mail ni de téléphone.
      properties:
        id: { type: string, format: uuid, description: "À envoyer dans operator.user_id." }
        name: { type: string, description: Prénom et nom. }
        role: { type: string, description: "Rôle Qayed, par exemple hotel_admin ou receptionist." }
      required: [id, name, role]
    Fiche:
      type: object
      properties:
        fiche_id: { type: string, format: uuid }
        booking_ref: { type: string }
        establishment_id: { type: string, format: uuid }
        guest_count: { type: integer }
        submitted_at: { type: string, format: date-time, nullable: true }
        authority_status:
          type: string
          enum: [pending, relayed, unavailable]
          description: |
            **Important** : ceci N'EST PAS un accusé de réception gouvernemental —
            aucune intégration directe avec le Ministère de l'Intérieur n'existe à
            ce jour. Cette valeur est dérivée de l'état du relais WhatsApp
            provisoire utilisé pour la transmission aux autorités :
            `pending` (transmission pas encore confirmée), `relayed` (message
            délivré/lu sur le canal de transmission), `unavailable` (toutes les
            tentatives de relais ont échoué). Ce champ est susceptible de changer
            de sémantique le jour où une homologation officielle sera en place.
        reference_number: { type: string, nullable: true }
        arrival_date: { type: string, format: date, nullable: true, description: (1.1.0) Date d'arrivée. }
        departure_date: { type: string, format: date, nullable: true, description: (1.1.0) Date de départ prévue. }
        checked_out_at:
          type: string
          format: date
          nullable: true
          description: (1.1.0) Date de départ réelle, null tant que le séjour est ouvert.
        room_id: { type: string, format: uuid, nullable: true, description: (1.1.0) Chambre Qayed rattachée. }
        stay_status:
          type: string
          enum: [draft, active, completed, cancelled]
          description: |
            (1.1.0) État du séjour : `draft` (fiche pas encore validée), `active`
            (séjour en cours), `completed` (départ enregistré, manuel ou automatique),
            `cancelled` (fiche annulée).
      required: [fiche_id, booking_ref, establishment_id, guest_count, authority_status]
    WidgetMessageSubmitted:
      type: object
      description: |
        (postMessage, widget vers fenêtre parente) Fiche validée. Signal d'interface
        uniquement : la source de vérité est le webhook `fiche.submitted` (live) ou
        `GET /v1/fiche-sessions/{session_id}` (test et live).
      properties:
        type: { type: string, const: "qayed:submitted" }
        session_id: { type: string, format: uuid }
        fiche_id: { type: string, format: uuid }
        guest_count: { type: integer }
      required: [type, session_id, fiche_id, guest_count]
    WidgetMessageClosed:
      type: object
      description: (postMessage) L'utilisateur a fermé le widget sans valider.
      properties:
        type: { type: string, const: "qayed:closed" }
        session_id: { type: string, format: uuid }
      required: [type, session_id]
    WidgetMessageError:
      type: object
      description: (postMessage) Erreur bloquante à l'ouverture du widget (lien expiré, origine refusée…).
      properties:
        type: { type: string, const: "qayed:error" }
        code:
          type: string
          description: Un code de `ErrorCode` (ex. `session_expired`), ou `unknown` pour une erreur réseau ou inattendue.
      required: [type, code]
    WidgetGuestInput:
      type: object
      description: Schéma strict utilisé par le widget lui-même — plus contraignant que le pré-remplissage libre de POST /v1/fiche-sessions.
      required: [first_name, last_name, date_of_birth, sex, nationality_code, document]
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        date_of_birth: { type: string, format: date, description: "Doit être antérieure à aujourd'hui." }
        sex: { type: string, enum: [M, F, X] }
        nationality_code: { type: string, minLength: 3, maxLength: 3, description: "Code pays ISO 3166-1 alpha-3." }
        country_of_birth: { type: string, minLength: 3, maxLength: 3, nullable: true }
        place_of_birth: { type: string, maxLength: 150, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, maxLength: 30, nullable: true }
        is_primary: { type: boolean, default: false }
        scan_id:
          type: string
          format: uuid
          nullable: true
          description: Identifiant d'un scan OCR précédemment envoyé via POST /widget/v1/scan, pour préremplir/valider le document.
        document:
          type: object
          required: [type, document_number, issuing_country_code]
          properties:
            type: { type: string, enum: [passport, national_id, residence_permit, visa, travel_document] }
            document_number: { type: string, maxLength: 100 }
            issuing_country_code: { type: string, minLength: 2, maxLength: 3 }
            issue_date: { type: string, format: date, nullable: true }
            expiry_date: { type: string, format: date, nullable: true }
            mrz_line1: { type: string, maxLength: 50, nullable: true }
            mrz_line2: { type: string, maxLength: 50, nullable: true }
    WebhookEventFicheSubmitted:
      type: object
      description: Événement Qayed-Event = fiche.submitted. Jamais envoyé pour une session créée avec une clé qyd_test_ (isolation du mode test).
      properties:
        fiche_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        booking_ref: { type: string }
        establishment_id: { type: string, format: uuid }
        guest_count: { type: integer }
        submitted_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
          description: Copie exacte du champ metadata envoyé à la création de la session.
      required: [fiche_id, session_id, booking_ref, establishment_id, guest_count, submitted_at, metadata]
    WebhookEventFicheFailed:
      type: object
      description: Événement Qayed-Event = fiche.failed. Envoyé même en mode test.
      properties:
        session_id: { type: string, format: uuid }
        booking_ref: { type: string }
        error_code:
          type: string
          description: "Actuellement toujours submission_failed — champ conservé stable pour un futur détail plus fin."
      required: [session_id, booking_ref, error_code]
    WebhookEventSessionExpired:
      type: object
      description: |
        Événement Qayed-Event = session.expired. Émis par le balayage planifié
        (job récurrent) sur les sessions pending dont le JWT a expiré sans qu'aucune
        fiche n'ait été soumise. Envoyé même en mode test.
      properties:
        session_id: { type: string, format: uuid }
        booking_ref: { type: string }
      required: [session_id, booking_ref]
    WebhookEnvelopeExample:
      type: object
      description: |
        Le corps brut du POST envoyé à votre endpoint EST directement l'objet
        événement ci-dessus (pas d'enveloppe supplémentaire) — le type d'événement se
        lit dans l'en-tête Qayed-Event, pas dans le corps.
x-webhooks-signature:
  description: |
    Chaque livraison porte deux en-têtes :
    - `Qayed-Event`: le nom de l'événement (fiche.submitted | fiche.failed | session.expired).
    - `Qayed-Signature`: `t={unix_timestamp},v1={hex}` où `hex` =
      `hash_hmac('sha256', "{timestamp}.{corps_brut_json}", secret_endpoint)`.

    Vérifiez systématiquement :
    1. Que `timestamp` est dans une fenêtre de tolérance de 300 secondes (par défaut,
       configurable) autour de l'heure courante — anti-rejeu.
    2. Que `hex` correspond au HMAC-SHA256 recalculé sur `"{timestamp}.{corps_brut}"`
       avec le secret de VOTRE endpoint, en comparaison à temps constant
       (`hash_equals` / `crypto.timingSafeEqual`).

    Le calcul DOIT porter sur les octets bruts du corps de la requête, avant tout
    parsing JSON — voir verify-webhook.js et verify-webhook.php.
  retry_schedule_minutes: [1, 5, 15, 60, 240, 1440]
  retry_notes: |
    Backoff exponentiel après le premier échec (HTTP non 2xx ou exception réseau),
    au moins 5 tentatives réparties sur 24h. Un endpoint est désactivé automatiquement
    après 20 échecs consécutifs par défaut (réactivable côté admin Qayed).
x-widget-messages:
  description: |
    Messages envoyés par le widget (iframe `widget_url`) à sa fenêtre parente via
    `window.parent.postMessage(message, '*')`. Les champs sont portés à plat sur le
    message (pas de sous-objet `payload`). Comme `targetOrigin` vaut `'*'`, la page
    parente DOIT vérifier `event.origin === 'https://api.qayed.tn'` (de préférence
    `new URL(widget_url).origin`) avant de lire `event.data`. Ce sont des signaux
    d'interface : la source de vérité est le webhook signé `fiche.submitted` (live) ou
    `GET /v1/fiche-sessions/{session_id}` (test et live).
  origin: https://api.qayed.tn
  messages:
    qayed:submitted:
      schema: { $ref: '#/components/schemas/WidgetMessageSubmitted' }
      example: { type: "qayed:submitted", session_id: "5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e", fiche_id: "a1b2c3d4-e5f6-4789-90ab-cdef01234567", guest_count: 2 }
    qayed:closed:
      schema: { $ref: '#/components/schemas/WidgetMessageClosed' }
      example: { type: "qayed:closed", session_id: "5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e" }
    qayed:error:
      schema: { $ref: '#/components/schemas/WidgetMessageError' }
      example: { type: "qayed:error", code: "session_expired" }
